<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>펫플즈 V.I.B 앰버서더</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="V.I.B">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>

<style>
:root{--bg:#f5f3fa;--card:#fff;--ink:#1d1a26;--muted:#6f6a7d;--line:#e8e4f0;--pur:#7c3aed;--pur2:#efe7fd;--dark:#1b1530;--ok:#0a7a43;--okw:#e3f6eb;--err:#c62828;--errw:#fdecec;--warn:#a15c00;--warnw:#fff1d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .logo{font-weight:800;letter-spacing:.5px}
.top .logo b{color:#c4b5fd}
.top .sp{flex:1}
.top .me{background:#3a2f5c;border:0;color:#fff;border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600}
.sync{position:fixed;top:0;left:0;height:3px;width:0;background:#c4b5fd;z-index:50;transition:width .4s,opacity .4s;opacity:0}
.sync.on{opacity:1;width:70%}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(27,21,48,.06)}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.hello{font-size:20px;font-weight:800;margin:2px 0 4px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:#eeebf5;color:#4a4458;white-space:nowrap}
.badge.pur{background:var(--pur2);color:var(--pur)}
.badge.ok{background:var(--okw);color:var(--ok)}
.badge.err{background:var(--errw);color:var(--err)}
.badge.warn{background:var(--warnw);color:var(--warn)}
.badge.dark{background:var(--dark);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
.bar{height:10px;background:#eeebf5;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pur);border-radius:6px;transition:width .5s}
.bar.done i{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eeebf5;border-radius:14px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--pur);color:#fff}
.chip.ok{background:var(--okw);color:var(--ok);font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;font-size:16px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pur)}
textarea.in{min-height:96px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--pur);color:#fff;font-weight:700;font-size:16px;margin-top:14px}
.btn:disabled{opacity:.55}
.btn.sub{background:#eeebf5;color:var(--ink)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item .t{font-weight:700;word-break:break-all}
.item .t a{color:var(--ink);text-decoration:none}
.check{list-style:none;padding:0;margin:8px 0 0}
.check li{padding:4px 0;font-size:14px}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--err);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button .ic{font-size:21px;line-height:1.1}
.nav button.on{color:var(--pur);font-weight:700}
.nav .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{aspect-ratio:1;border-radius:6px;background:#eeebf5;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cal div.h{background:#c4b5fd;color:#2e1065;font-weight:700}
.cal div.b{background:var(--pur);color:#fff;font-weight:700}
.cal div.t{outline:2px solid var(--dark)}
.qa{border-top:1px solid var(--line);padding:12px 0}
.qa:first-child{border-top:0;padding-top:0}
.bubble{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.bubble.a{background:var(--pur2)}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:150px}
.step button{border:0;background:#fff;width:46px;height:46px;font-size:22px}
.step input{border:0;width:58px;text-align:center;font-size:17px;font-weight:700;outline:none}
.prod{display:grid;gap:8px}
.prod button{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px;text-align:left;font-weight:600}
.prod button.on{border-color:var(--pur);background:var(--pur2);color:var(--pur)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1a26;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login .brand{text-align:center;margin-bottom:22px}
.login .brand .l1{font-size:30px;font-weight:900;color:var(--dark)}
.login .brand .l1 b{color:var(--pur)}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.skel{background:linear-gradient(90deg,#eeebf5 25%,#f6f4fa 50%,#eeebf5 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:90px;margin-bottom:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.today{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.today .t1{flex:0 0 auto;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px}
.today .t1 b{display:block;font-size:14px}
.pend{opacity:.6}
.vbars{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:10px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vbars .c i{display:block;width:100%;background:#c4b5fd;border-radius:4px 4px 0 0;min-height:2px}
.vbars .c i.b{background:var(--pur)}
.vbars .c span{font-size:9px;color:var(--muted);margin-top:3px}
.hrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hrow .k{width:92px;flex:0 0 92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{flex:1;height:12px;background:#eeebf5;border-radius:6px;overflow:hidden}
.hrow .v i{display:block;height:100%;background:var(--pur)}
.hrow .n{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.bubble.me{margin-left:28px}
.bubble.them{margin-right:28px}
.who{font-size:11px;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:6px;margin-top:8px}
</style>
</head>
<body>
<div class="sync" id="sync"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var URL_K = "", APP_PATH = "";
</script>
<script>
var IS_PWA = typeof API_URL !== 'undefined' && !!API_URL;
var PWA_URL = ['https:', '', 'thomas920103.github.io', 'vib-app', ''].join('/');
if (IS_PWA) { URL_K = (location.search.match(/[?&]k=([a-f0-9]{64})/) || [])[1] || ''; APP_PATH = ''; }
if (!/^[a-f0-9]{64}$/.test(URL_K)) URL_K = '';
if (!/^[A-Za-z0-9._~-]+(\/[A-Za-z0-9._~-]+)+$/.test(APP_PATH)) APP_PATH = '';
var S = {t: null, d: null, tab: 'home', busy: false, pv: null, req: {product: '', qty: 1}, kind: '포스팅', loginPw: ''};
var KEY_T = 'vib.token', KEY_D = 'vib.data', KEY_SEEN = 'vib.seen';
var $ = function (q) { return document.querySelector(q); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function won(n) { return Math.round(n || 0).toLocaleString('ko-KR'); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, 2400); }
function syncBar(on) { $('#sync').classList.toggle('on', !!on); }
function nk(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }
function dDiff(a, b) { var p = function (s) { var x = s.split('-'); return new Date(+x[0], +x[1] - 1, +x[2]); }; return Math.round((p(b) - p(a)) / 864e5); }
function ym(d) { return (d || '').slice(0, 7); }
function md(d) { return d ? (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) : ''; }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var done = function (res, rej) {
    return function (x) {
      if (x && x.ok) return res(x);
      if (x && x.login) { logoutLocal(); toast(x.error); }
      rej(new Error((x && x.error) || '잠시 후 다시 해 주세요.'));
    };
  };
  return new Promise(function (res, rej) {
    if (IS_PWA) {
      fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'app', fn: fn, args: args}), redirect: 'follow', credentials: 'omit'})
        .then(function (r) { return r.json(); }).then(done(res, rej))
        .catch(function () { rej(new Error(navigator.onLine === false ? '인터넷 연결을 확인해 주세요.' : '연결이 불안정해요. 잠시 후 다시 해 주세요.')); });
      return;
    }
    var r = google.script.run.withSuccessHandler(done(res, rej)).withFailureHandler(function () { rej(new Error('연결이 불안정해요. 잠시 후 다시 해 주세요.')); });
    r[fn].apply(r, args);
  });
}

function setData(d) {
  if (!d) return;
  if (S.ro) { S.d = d; return; }
  if (d.admin) { var ad = {}; for (var k in d) if (k !== 'ok' && k !== 'token' && k !== 'mustChange') ad[k] = d[k]; S.d = ad; lsSet(KEY_D, JSON.stringify(ad)); return; }
  var keep = {me: d.me, today: d.today, st: d.st, posts: d.posts, reqs: d.reqs, inq: d.inq, stats: d.stats};
  S.d = keep;
  lsSet(KEY_D, JSON.stringify(keep));
}
function keepLink() { return ''; }
function needKeep() { return false; }
function goKeep() {}
var INSTALL = {prompt: null};
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); INSTALL.prompt = e; var b = document.getElementById('instBtn'); if (b) b.classList.remove('hide'); });
window.addEventListener('appinstalled', function () { INSTALL.prompt = null; toast('앱을 설치했어요. 홈 화면의 아이콘으로 열어 주세요.'); renderMainSafe(); });
function renderMainSafe() { if (S.t && S.d) renderMain(); else if (!S.t) renderLogin(); }
function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function deviceInfo() {
  var ua = navigator.userAgent || '';
  return {ios: /iPhone|iPad|iPod/i.test(ua), android: /Android/i.test(ua), inApp: /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua), samsung: /SamsungBrowser/i.test(ua)};
}
function keepCard() {
  if (S.ro || standalone()) return '';
  var dv = deviceInfo(), steps;
  if (!IS_PWA) {
    return '<div class="card" style="border:2px solid var(--pur)"><h3>📲 휴대폰에 앱으로 설치하기</h3>' +
      '<div class="muted">앱으로 설치하면 아이콘을 눌러 바로 열리고, 로그인도 계속 유지돼요.</div>' +
      '<a class="btn" style="text-align:center;text-decoration:none" href="' + esc(PWA_URL) + '" target="_top">앱 설치 화면으로 가기</a></div>';
  }
  if (dv.inApp) steps = '지금은 카카오톡·네이버 같은 앱 안의 화면이라 설치가 안 돼요.<br>오른쪽 위 <b>⋮</b> 또는 공유 버튼 → <b>' + (dv.ios ? 'Safari로 열기' : '다른 브라우저로 열기') + '</b>를 누른 뒤 다시 설치해 주세요.';
  else if (dv.ios) steps = '<b>Safari</b> 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → 오른쪽 위 <b>추가</b>';
  else if (dv.samsung) steps = '아래 <b>[앱 설치]</b> 버튼, 또는 메뉴 <b>≡</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b>';
  else steps = '아래 <b>[앱 설치]</b> 버튼, 또는 오른쪽 위 <b>⋮</b> → <b>앱 설치</b>(또는 홈 화면에 추가)';
  return '<div class="card" style="border:2px solid var(--pur)"><h3>📲 휴대폰에 앱 설치</h3>' +
    '<div class="muted">설치하면 홈 화면 아이콘으로 바로 열리고, 로그인도 계속 유지돼요.</div>' +
    '<div class="bubble" style="margin-top:8px">' + steps + '</div>' +
    '<button class="btn' + (INSTALL.prompt ? '' : ' hide') + '" id="instBtn">앱 설치</button></div>';
}
function bindInstall() {
  var b = document.getElementById('instBtn');
  if (!b) return;
  b.onclick = function () {
    if (!INSTALL.prompt) { toast('브라우저 메뉴에서 앱 설치(홈 화면에 추가)를 눌러 주세요.'); return; }
    INSTALL.prompt.prompt();
    INSTALL.prompt.userChoice.then(function () { INSTALL.prompt = null; });
  };
}
function logoutLocal() { S.ro = false; S.viewId = ''; S.adminD = null; S.t = null; S.d = null; lsSet(KEY_T, null); lsSet(KEY_D, null); renderLogin(); }

function renderLogin(msg) {
  $('#app').innerHTML = '<div class="login"><div class="brand"><div class="l1">펫플즈 <b>V.I.B</b></div><div class="muted">Very Important Butler 앰버서더</div></div>' +
    '<div class="card"><label>아이디</label><input class="in" id="lid" autocomplete="username" autocapitalize="none" placeholder="메일 아이디 (메일 주소의 @ 앞부분)">' +
    '<label>비밀번호</label><input class="in" id="lpw" type="password" autocomplete="current-password" placeholder="처음 비밀번호는 1234">' +
    '<button class="btn" id="lbtn">로그인</button><div class="err" id="lerr">' + esc(msg || '') + '</div>' +
    '<div class="muted">아이디·비밀번호를 모르시면 담당자(thomas@myohan.co.kr)에게 문의해 주세요.</div></div>' + keepCard() + '</div>';
  bindInstall();
  var go = function () {
    var id = $('#lid').value.trim(), pw = $('#lpw').value;
    if (!id || !pw) { $('#lerr').textContent = '아이디와 비밀번호를 넣어 주세요.'; return; }
    $('#lbtn').disabled = true; $('#lbtn').textContent = '로그인 중…'; $('#lerr').textContent = '';
    call('appLogin', id, pw).then(function (r) {
      S.t = r.token; lsSet(KEY_T, r.token); setData(r); S.loginPw = pw;
      if (r.mustChange) renderChangePw(true); else { S.tab = r.admin ? 'aperf' : 'home'; renderMain(); goKeep(); }
    }).catch(function (e) { $('#lerr').textContent = e.message; $('#lbtn').disabled = false; $('#lbtn').textContent = '로그인'; });
  };
  $('#lbtn').onclick = go;
  $('#lpw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}

function renderChangePw(first) {
  $('#app').innerHTML = '<div class="login"><div class="brand"><div class="l1">비밀번호 <b>바꾸기</b></div>' +
    '<div class="muted">' + (first ? '처음 로그인하셨어요. 나만 아는 비밀번호로 바꿔 주세요.' : '') + '</div></div>' +
    '<div class="card">' + (first ? '' : '<label>지금 비밀번호</label><input class="in" id="p0" type="password" autocomplete="current-password">') +
    '<label>새 비밀번호 (4자 이상)</label><input class="in" id="p1" type="password" autocomplete="new-password">' +
    '<label>새 비밀번호 확인</label><input class="in" id="p2" type="password" autocomplete="new-password">' +
    '<button class="btn" id="pbtn">바꾸기</button>' + (first ? '' : '<button class="btn sub" id="pcancel">취소</button>') + '<div class="err" id="perr"></div></div></div>';
  $('#pbtn').onclick = function () {
    var old = first ? S.loginPw : $('#p0').value, a = $('#p1').value, b = $('#p2').value;
    if (a.length < 4) { $('#perr').textContent = '4자 이상으로 넣어 주세요.'; return; }
    if (a !== b) { $('#perr').textContent = '새 비밀번호 두 칸이 달라요.'; return; }
    $('#pbtn').disabled = true;
    call('appChangePw', S.t, old, a).then(function () { S.loginPw = ''; toast('비밀번호를 바꿨어요.'); renderMain(); if (first) goKeep(); })
      .catch(function (e) { $('#perr').textContent = e.message; $('#pbtn').disabled = false; });
  };
  if (!first) $('#pcancel').onclick = function () { renderMain(); };
}

var TABS = [['home', '🏠', '홈'], ['post', '📝', '포스팅'], ['req', '📦', '제품 신청'], ['perf', '📈', '성과'], ['inq', '💬', '문의']];

function adminCount(q) { return (q.thread || []).filter(function (m) { return m.by === 'admin'; }).length; }
function newAnswers() {
  if (S.ro) return 0;
  var seen = JSON.parse(lsGet(KEY_SEEN) || '{}');
  return (S.d.inq || []).filter(function (q) { return adminCount(q) > (+seen[q.id] || 0); }).length;
}
function threadHtml(q, adminView) {
